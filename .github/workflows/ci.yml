name: CI

on:
  push:
    # `feature/*`, not a named branch: the merge bar is a per-branch promise,
    # and a pinned branch name silently stops making it (the entry this
    # replaced named one finished feature branch and matched nothing after).
    branches: [main, feature/*]
  pull_request:

jobs:
  lint-test-build:
    name: Lint, test, and build (${{ matrix.os }})
    # Every OS this app ships on runs the FULL AGENTS.md bar, not just Linux.
    # A platform whose compiler has never been run is an untested platform:
    # `src-tauri` carries deliberate `#[cfg(unix)]`/`#[cfg(target_os = "linux")]`
    # hygiene that only a Windows/macOS compile proves, and finding it on the
    # first release tag would mean the tag is the test. `macos-latest` is the
    # standard (free for a public repo) runner — never an `-xlarge`-class
    # label (charged even here) and never a pinned `macos-14` (deprecated
    # upstream, so the label dies under us).
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's red must not cancel the other two: a Windows-only
      # compile error hiding a macOS-only one costs a second full round-trip
      # to discover, which is the slowest possible way to read the list.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No toolchain version named here on purpose: `src-tauri/rust-toolchain.toml`
      # is the pin, and naming one in this step fights it (`rustup default`
      # loses to the directory override, so the version installed would be
      # the version NOT used — and its clippy/rustfmt would be installed
      # onto a toolchain nothing runs). Run from `src-tauri/` so rustup reads
      # the file, which also carries the `components` (a command-line
      # `--component` is ignored when no toolchain is named). `rustup
      # default` then makes the pin the default too, so a cargo step that
      # does not set `working-directory` still resolves the pinned compiler.
      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        shell: bash
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustc --version

      # The pnpm store is cached (see `cache: pnpm` on setup-node below); the Rust
      # target dir is not, on either OS, so every run recompiles the dependency
      # tree from scratch: run 38763849950 counted 563 crates compiled cold on
      # Windows and 715 on Ubuntu, which is most of what those job times
      # (windows 13.5 min, ubuntu 7.2, macos 7.6) spend. An empty runner image has
      # no `~/.cargo/registry` and no `src-tauri/target`; this step gives the next
      # one both.
      #
      # Placed AFTER the toolchain step on purpose: the action hashes the ACTIVE
      # rustc (`rustc -vV` plus `rustup toolchain list`) into the key, so the key
      # describes the compiler the cargo steps below actually run — and the
      # pinned toolchain only becomes active once `rustup default` has run. (A
      # rust-toolchain.toml bump changes the key regardless: that file is itself
      # one of the hashed key files, so a bump means a cold run on every OS —
      # stated plainly in AGENTS.md's pin rule, and never a red.)
      #
      # ONE input, and the action's defaults are the policy — spelled-out
      # overrides only lie to the next reader:
      #   - per-OS key scoping is automatic (the key carries runner OS, arch,
      #     toolchain version and a lockfile-ish hash), so a Linux cache is never
      #     handed to a Windows runner,
      #   - the debug profile is what gets cached, which is what the cargo steps
      #     below (fmt aside, which compiles nothing) build — `pnpm build` is
      #     `tsc && vite build` and touches no Rust at all,
      #   - `cache-all-crates` defaults false: this workspace's OWN crates are not
      #     restored, only third-party deps. Right call for a PR workflow — our
      #     code changes every run, so restoring it would pay upload+download
      #     bytes for artifacts that are stale before the first compile.
      #
      # Honest cost: this consumes the repo's shared 10 GB Actions cache quota,
      # and entries are evicted once they are 7 days unhit. A key miss (a lockfile
      # change, a toolchain bump, an evicted entry) is exactly today's behavior —
      # a cold compile, never a red build.
      - name: Cache the Rust dependencies
        uses: Swatinem/rust-cache@v2 # latest major; current release v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri's Linux prerequisites (webkit2gtk 4.1 + friends). The apt
      # invocation and every package name in it are Linux-only: macOS needs
      # nothing the runner image does not already carry (the Xcode
      # command-line tools), and Windows needs nothing at all (the WebView2
      # runtime is part of the image). Gated on `runner.os` rather than the
      # matrix value because the step is about the MACHINE it lands on.
      - name: Install Linux build dependencies
        if: runner.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # `--all-targets` is the documented gate (AGENTS.md); without it the
      # integration tests under `src-tauri/tests/` are never linted and
      # lint-only breakage lands on main green.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The crash-log leak guard (crash-log-hardening Task 7), in two halves: the
      # `cargo test` step below runs the suite with its data dir REDIRECTED into
      # the runner temp dir, and the `Check the test suite wrote no crash log`
      # step after it requires zero `crash-*.log` to have landed there.
      #
      # The redirect is the PREMISE of the question, not a detail: a runner's
      # real data dir was never written to, so asking "is it empty?" there
      # answers "yes" having checked nothing. This repo records that exact shape
      # at `src-tauri/src/agent/tools/exec.rs:1780-1791` — the first version of
      # the stdin test passed with `closed_stdin` DELETED, because CI's fd 0 was
      # already `/dev/null`. So `test_support::the_ci_data_dir_redirect_took_effect`
      # (running inside the step below) fails the run when the redirect did NOT
      # take effect, and the script asserts the conclusion.
      #
      # ⚠ LINUX + macOS ONLY — there is deliberately no Windows redirect here,
      # and no `APPDATA:` line should ever be added to "fix" that. `dirs` 6.0.0
      # resolves the Windows data dir with
      # `SHGetKnownFolderPath(FOLDERID_RoamingAppData)`
      # (`dirs-sys-0.5.0/src/lib.rs:150-178`; `dirs-6.0.0/src/win.rs:10`), which
      # IGNORES `%APPDATA%` — a Windows redirect would change nothing and the
      # check would pass for exactly the wrong reason. Windows keeps the
      # `childproc` census invariant as its ONLY guard: a recorded gap (ADR 0025
      # amendment), not an oversight.
      #
      # Why the variable differs per OS: Linux honours `XDG_DATA_HOME`
      # (`dirs-6.0.0/src/lin.rs:11`, which makes `data_dir()` EQUAL to it); macOS
      # reads only `HOME` and resolves `$HOME/Library/Application Support`
      # (`dirs-6.0.0/src/mac.rs:7,12`), so there the app dir sits THREE levels
      # below the redirect — which is why the script searches recursively. Both
      # arms name the SAME path (`$RUNNER_TEMP/archimedes-test-data`), so the one
      # check step below needs no OS branch of its own.
      #
      # `cargo fmt` / `cargo clippy` above get no redirect: they compile, they do
      # not run the app. `pnpm test` / `pnpm build` below are untouched for the
      # same reason — and because a job-wide `HOME` override would move pnpm's
      # cache, which is why the redirect sits on STEP env, not job env.
      #
      # Gates are `runner.os`, lowercase, matching `Install Linux build
      # dependencies` above (GitHub's string `==` is case-insensitive; the file
      # already chose lowercase, so a second spelling would be a false
      # distinction). The three `cargo test` steps are mutually exclusive and
      # exhaustive — every OS in the matrix still runs the full Rust suite.
      - name: cargo test
        if: runner.os == 'linux'
        working-directory: src-tauri
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/archimedes-test-data
          ARCHIMEDES_TEST_DATA_DIR: ${{ runner.temp }}/archimedes-test-data
        run: cargo test

      # The same step, macOS-shaped: `HOME` is the only variable `dirs` consults
      # there. ⚠ A redirected `HOME` can make rustup auto-install the pinned
      # toolchain into the fake home (measured locally: 1.5 GB, 12.8 s, with
      # `RUSTUP_HOME` unset). On GitHub-hosted runners `RUSTUP_HOME` and
      # `CARGO_HOME` are runner env vars OUTSIDE `HOME`, so this is instant; if
      # this step ever turns slow, that is the first thing to look at.
      - name: cargo test (data dir redirected via HOME)
        if: runner.os == 'macos'
        working-directory: src-tauri
        env:
          HOME: ${{ runner.temp }}/archimedes-test-data
          ARCHIMEDES_TEST_DATA_DIR: ${{ runner.temp }}/archimedes-test-data
        run: cargo test

      # Windows runs the suite UNGATED-and-unredirected: nothing to point it at
      # (see the ⚠ above). Its leak guard is the census test in
      # `src-tauri/src/agent/childproc.rs`, and nothing here.
      - name: cargo test (no data-dir redirect exists on Windows)
        if: runner.os == 'windows'
        working-directory: src-tauri
        run: cargo test

      # The guard's second half. Re-exports the same path on THIS step, because
      # step-level `env` does not leak between steps — a step that just said
      # `"$ARCHIMEDES_TEST_DATA_DIR"` would expand to the empty string, and the
      # script rejects an empty argument precisely so a lost `env:` here reddens
      # the step instead of scanning nothing and passing.
      #
      # Gated `!= 'windows'` to match the two redirecting steps above: Windows ran
      # no redirect, so there is nothing for it to check.
      #
      # What this pair does NOT catch, stated plainly so nobody over-trusts it:
      # the path literal is repeated on each step (step env cannot be shared), so
      # renaming it on ONE step would leave the check scanning a different
      # directory from the one the suite wrote to — a non-existent directory exits
      # 0 ("nothing ran"), which is green. `the_ci_data_dir_redirect_took_effect`
      # catches the other direction (the variable IS set but `dirs` ignores it,
      # e.g. `XDG_DATA_HOME` handed to a macOS runner, or a `dirs` upgrade that
      # changes resolution); it cannot catch the variable being dropped from the
      # test step, because an unset variable is the local-run arm. Keep the three
      # literals identical.
      - name: Check the test suite wrote no crash log
        if: runner.os != 'windows'
        env:
          ARCHIMEDES_TEST_DATA_DIR: ${{ runner.temp }}/archimedes-test-data
        run: bash scripts/check-test-data-dir.sh "$ARCHIMEDES_TEST_DATA_DIR"

      # The junit report exists for the one failure mode this workflow could not
      # answer: a single test failing ONCE, on a cold first run, with nothing to
      # reproduce it. The log that named it is the log the next push overwrites in
      # the PR view, so the datapoint is gone by the time anyone goes looking —
      # this artifact keeps the per-test names, times and failure messages past the
      # log. `pnpm test` is `vitest run`, so the reporter args reach vitest
      # untouched (verified locally, including on a failing run: the report is
      # written and the step still exits non-zero, so `failure()` below fires).
      - name: pnpm test
        run: pnpm test --reporter=default --reporter=junit --outputFile=vitest-results.xml

      # `if: failure()` — on a green run the answer is already in the log, and
      # three reports per push (one per OS) would cost quota to say nothing.
      # `if: always()` would additionally upload the CANCELLED case, which is a
      # timeout of the JOB rather than a test result. The name carries the OS
      # because artifact names must be unique within a run in upload-artifact v4:
      # three matrix legs posting one name fail the second leg instead of keeping
      # both, and which OS flaked is half the answer. Short retention on purpose —
      # a stale report is worse than no report.
      - name: Upload the vitest junit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results-${{ matrix.os }}
          path: vitest-results.xml
          retention-days: 7

      - name: pnpm build
        run: pnpm build

  # The version lives in three files (package.json, src-tauri/Cargo.toml,
  # src-tauri/tauri.conf.json) and no build step ties them together, so the
  # disagreement this job catches would otherwise surface as a shipped bundle
  # announcing the wrong number. Separate job, not a step in the one above: it
  # needs jq and nothing else, so it owes no toolchain install and stays fast
  # enough to be the first red light on the PR that introduced the drift.
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jq is preinstalled on the ubuntu runners — asserting it here would be
      # the job testing its own runner image.
      - name: Test the version check
        run: bash scripts/check-versions.test.sh

      # The crash-log leak guard's own harness. It lives HERE rather than only in
      # the `lint-test-build` matrix because the guard is a shell script: its
      # fixtures (`supervisor.log` in the same dir, the nested macOS `archimedes/`
      # level) are exactly the cases a matrix step cannot reach, and the macOS
      # nesting case is the one that decides whether that guard is vacuous.
      - name: Test the test-data-dir crash-log check
        run: bash scripts/check-test-data-dir.test.sh

      - name: Test the updater-manifest composer
        run: bash scripts/compose-updater-manifest.test.sh

      # The release-notes generator is the third script with a silent failure
      # mode (GitHub's endpoint answers 200 for a tag that has no release), so it
      # is under scripts/ with tests here rather than inlined into release.yml —
      # where no fixture could reach it.
      - name: Test the release-notes generator
        run: bash scripts/release-notes.test.sh

      # The same check on the real checkout, so the guard runs even when the
      # test script above is what changed.
      - name: Check the three version fields agree
        run: bash scripts/check-versions.sh
