name: CI

on:
  push:
    # `feature/*`, not a named branch: the merge bar is a per-branch promise,
    # and a pinned branch name silently stops making it (the entry this
    # replaced named one finished feature branch and matched nothing after).
    branches: [main, feature/*]
  pull_request:

jobs:
  lint-test-build:
    name: Lint, test, and build (${{ matrix.os }})
    # Every OS this app ships on runs the FULL AGENTS.md bar, not just Linux.
    # A platform whose compiler has never been run is an untested platform:
    # `src-tauri` carries deliberate `#[cfg(unix)]`/`#[cfg(target_os = "linux")]`
    # hygiene that only a Windows/macOS compile proves, and finding it on the
    # first release tag would mean the tag is the test. `macos-latest` is the
    # standard (free for a public repo) runner — never an `-xlarge`-class
    # label (charged even here) and never a pinned `macos-14` (deprecated
    # upstream, so the label dies under us).
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's red must not cancel the other two: a Windows-only
      # compile error hiding a macOS-only one costs a second full round-trip
      # to discover, which is the slowest possible way to read the list.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No toolchain version named here on purpose: `src-tauri/rust-toolchain.toml`
      # is the pin, and naming one in this step fights it (`rustup default`
      # loses to the directory override, so the version installed would be
      # the version NOT used — and its clippy/rustfmt would be installed
      # onto a toolchain nothing runs). Run from `src-tauri/` so rustup reads
      # the file, which also carries the `components` (a command-line
      # `--component` is ignored when no toolchain is named). `rustup
      # default` then makes the pin the default too, so a cargo step that
      # does not set `working-directory` still resolves the pinned compiler.
      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        shell: bash
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustc --version

      # The pnpm store is cached (see `cache: pnpm` on setup-node below); the Rust
      # target dir is not, on either OS, so every run recompiles the dependency
      # tree from scratch: run 38763849950 counted 563 crates compiled cold on
      # Windows and 715 on Ubuntu, which is most of what those job times
      # (windows 13.5 min, ubuntu 7.2, macos 7.6) spend. An empty runner image has
      # no `~/.cargo/registry` and no `src-tauri/target`; this step gives the next
      # one both.
      #
      # Placed AFTER the toolchain step on purpose: the action hashes the ACTIVE
      # rustc (`rustc -vV` plus `rustup toolchain list`) into the key, so the key
      # describes the compiler the cargo steps below actually run — and the
      # pinned toolchain only becomes active once `rustup default` has run. (A
      # rust-toolchain.toml bump changes the key regardless: that file is itself
      # one of the hashed key files, so a bump means a cold run on every OS —
      # stated plainly in AGENTS.md's pin rule, and never a red.)
      #
      # ONE input, and the action's defaults are the policy — spelled-out
      # overrides only lie to the next reader:
      #   - per-OS key scoping is automatic (the key carries runner OS, arch,
      #     toolchain version and a lockfile-ish hash), so a Linux cache is never
      #     handed to a Windows runner,
      #   - the debug profile is what gets cached, which is what the cargo steps
      #     below (fmt aside, which compiles nothing) build — `pnpm build` is
      #     `tsc && vite build` and touches no Rust at all,
      #   - `cache-all-crates` defaults false: this workspace's OWN crates are not
      #     restored, only third-party deps. Right call for a PR workflow — our
      #     code changes every run, so restoring it would pay upload+download
      #     bytes for artifacts that are stale before the first compile.
      #
      # Honest cost: this consumes the repo's shared 10 GB Actions cache quota,
      # and entries are evicted once they are 7 days unhit. A key miss (a lockfile
      # change, a toolchain bump, an evicted entry) is exactly today's behavior —
      # a cold compile, never a red build.
      - name: Cache the Rust dependencies
        uses: Swatinem/rust-cache@v2 # latest major; current release v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri's Linux prerequisites (webkit2gtk 4.1 + friends). The apt
      # invocation and every package name in it are Linux-only: macOS needs
      # nothing the runner image does not already carry (the Xcode
      # command-line tools), and Windows needs nothing at all (the WebView2
      # runtime is part of the image). Gated on `runner.os` rather than the
      # matrix value because the step is about the MACHINE it lands on.
      - name: Install Linux build dependencies
        if: runner.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # `--all-targets` is the documented gate (AGENTS.md); without it the
      # integration tests under `src-tauri/tests/` are never linted and
      # lint-only breakage lands on main green.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

  # The version lives in three files (package.json, src-tauri/Cargo.toml,
  # src-tauri/tauri.conf.json) and no build step ties them together, so the
  # disagreement this job catches would otherwise surface as a shipped bundle
  # announcing the wrong number. Separate job, not a step in the one above: it
  # needs jq and nothing else, so it owes no toolchain install and stays fast
  # enough to be the first red light on the PR that introduced the drift.
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jq is preinstalled on the ubuntu runners — asserting it here would be
      # the job testing its own runner image.
      - name: Test the version check
        run: bash scripts/check-versions.test.sh

      - name: Test the updater-manifest composer
        run: bash scripts/compose-updater-manifest.test.sh

      # The same check on the real checkout, so the guard runs even when the
      # test script above is what changed.
      - name: Check the three version fields agree
        run: bash scripts/check-versions.sh
